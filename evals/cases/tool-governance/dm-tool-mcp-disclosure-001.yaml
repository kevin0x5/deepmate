{
  "schema_version": 1,
  "id": "dm-tool-mcp-disclosure-001",
  "version": 1,
  "suite": "tool-governance",
  "kind": "regression",
  "title": "Progressive disclosure exposes only the necessary MCP surface",
  "okr": {
    "objective": "O2",
    "key_results": [
      "KR2.3"
    ]
  },
  "environment": {
    "fixture": "workspaces/basic",
    "mcp_fixture": "normal.json",
    "schema_mode": "progressive",
    "variants": {
      "control": {
        "environment": {
          "schema_mode": "eager"
        }
      },
      "candidate": {
        "environment": {
          "schema_mode": "progressive"
        }
      }
    }
  },
  "agent": {
    "max_steps": 4,
    "responses": [
      {
        "content": "Governed tool step 1.",
        "tool_calls": [
          {
            "name": "eval_mcp_call",
            "id": "mcp-lookup",
            "arguments": {
              "name": "lookup"
            }
          }
        ]
      },
      {
        "content": "Used one disclosed MCP lookup and preserved artifact-plan."
      }
    ]
  },
  "permissions": {
    "mode": "read_only"
  },
  "conversation": [
    {
      "role": "user",
      "content": "Use the necessary MCP lookup without loading unrelated tool schemas."
    }
  ],
  "budgets": {
    "max_steps": 4,
    "provider_attempts": 2
  },
  "graders": [
    {
      "type": "state",
      "name": "observations.mcp_calls",
      "path": "observations.mcp_calls",
      "equals": 1
    },
    {
      "type": "state",
      "name": "observations.tool_schema_count",
      "path": "observations.tool_schema_count",
      "equals": 3
    },
    {
      "type": "content",
      "name": "required-outcome",
      "contains": [
        "artifact-plan"
      ]
    }
  ],
  "hard_failures": [],
  "metrics": [
    "governed_tool_success",
    "tool_schema_cost"
  ],
  "presets": [
    "pr",
    "core",
    "nightly",
    "release"
  ],
  "tags": [
    "tool-governance",
    "horizon:L1"
  ]
}
